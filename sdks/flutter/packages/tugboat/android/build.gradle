group = "com.tugboat.flutter"
version = "0.8.12"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

def repoRoot = file("${project.projectDir}/../../../../..")
def captureRuntimeDir = file("${repoRoot}/platforms/android/capture-runtime")
def imageCoreDir = file("${repoRoot}/core/image-processing")
def hasNativeRuntime =
    file("${captureRuntimeDir}/src/main/java/com/tugboat/capture/CaptureRuntime.kt").isFile() &&
        file("${imageCoreDir}/include/tugboat/tb_image_core.h").isFile()

android {
    namespace = "com.tugboat.flutter"
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        if (hasNativeRuntime) {
            main.java.srcDirs += "${captureRuntimeDir}/src/main/java"
        } else {
            // Published / pub-cache checkouts do not ship platforms/android.
            main.java.srcDirs += "src/stub/kotlin"
        }
    }

    defaultConfig {
        minSdk = 21
        if (hasNativeRuntime) {
            consumerProguardFiles("${captureRuntimeDir}/consumer-rules.pro")
            externalNativeBuild {
                cmake {
                    arguments "-DTB_IMAGE_CORE_DIR=${imageCoreDir.canonicalPath}",
                            "-DTB_IMAGE_CORE_BUILD_TESTS=OFF",
                            "-DANDROID_STL=c++_static"
                }
            }
        }
    }

    if (hasNativeRuntime) {
        externalNativeBuild {
            cmake {
                path = file("${captureRuntimeDir}/src/main/cpp/CMakeLists.txt")
            }
        }
    }
}
