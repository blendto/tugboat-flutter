name: tugboat_build
description: >-
  build_runner builder that generates the widgetNames map for the Tugboat SDK,
  so obfuscated Flutter release builds keep readable widget names.
version: 0.1.0
publish_to: none
repository: https://github.com/blendto/tugboat-flutter
issue_tracker: https://github.com/blendto/tugboat-flutter/issues
homepage: https://github.com/blendto/tugboat-flutter
license: AGPL-3.0-only

environment:
  sdk: ^3.9.2

resolution: workspace

dependencies:
  build: ">=3.0.0 <6.0.0"
  glob: ^2.1.3

dev_dependencies:
  analyzer: ^7.7.1
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
