name: Flutter adapter

# Quick tier: runs on every push to a pull request and every push to main
# that changes the files it checks (see README.md in this folder).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "sdks/flutter/**"
      - "conformance/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "tool/ci/run-flutter-tests.sh"
      - "tool/ci/verify-native-capture-pigeon.sh"
      - ".github/workflows/flutter-adapter.yml"
  push:
    branches: [main]
    paths:
      - "sdks/flutter/**"
      - "conformance/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "tool/ci/run-flutter-tests.sh"
      - "tool/ci/verify-native-capture-pigeon.sh"
      - ".github/workflows/flutter-adapter.yml"

permissions:
  contents: read

# One run per PR: a new push cancels the previous run. Every push to main
# gets its own group (by commit), so main runs are never cancelled or
# superseded, and each merge saves its caches.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pigeon:
    name: Verify Pigeon outputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Dart dependencies
        run: flutter pub get
      - name: Verify generated native capture bridges
        run: bash tool/ci/verify-native-capture-pigeon.sh

  static-checks:
    name: Format and analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Dart dependencies
        run: dart pub get
      # Same commands as `melos run format:check` and `melos run analyze`,
      # called directly: `dart run melos` cannot locate itself on the runner.
      - name: Check formatting
        run: bash tool/ci/format.sh --check
      # Warnings and errors fail; infos do not, because the floating stable
      # channel adds deprecation infos with each Flutter release.
      - name: Analyze
        run: dart analyze .

  test:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [tugboat, tugboat_dio, tugboat_http, tugboat_build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Dart dependencies
        run: dart pub get
      # The tap benchmark asserts wall-clock budgets, which a shared runner
      # cannot hold steady; it stays a local guard.
      - name: Run package tests
        env:
          TUGBOAT_SKIP_BENCHMARKS: "1"
        run: bash tool/ci/run-flutter-tests.sh ${{ matrix.package }}

  pub-dry-run:
    name: pub publish dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Dart dependencies
        run: dart pub get
      - name: Dry-run pub publish
        run: bash tool/ci/pub-dry-run.sh
