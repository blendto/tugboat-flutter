name: Flutter adapter

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  pigeon:
    name: Verify Pigeon outputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Dart dependencies
        run: flutter pub get
      - name: Verify generated native capture bridges
        run: bash tool/ci/verify-native-capture-pigeon.sh

  static-checks:
    name: Format and analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Dart dependencies
        run: dart pub get
      - name: Check formatting
        run: dart run melos run format:check
      - name: Analyze
        run: dart run melos run analyze

  test:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [tugboat, tugboat_dio, tugboat_build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Dart dependencies
        run: dart pub get
      # The tap benchmark asserts wall-clock budgets, which a shared runner
      # cannot hold steady; it stays a local guard.
      - name: Run package tests
        env:
          TUGBOAT_SKIP_BENCHMARKS: "1"
        run: bash tool/ci/run-flutter-tests.sh ${{ matrix.package }}

  pub-dry-run:
    name: pub publish dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Dart dependencies
        run: dart pub get
      - name: Dry-run pub publish
        run: bash tool/ci/pub-dry-run.sh
