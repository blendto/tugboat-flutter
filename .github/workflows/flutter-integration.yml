name: Flutter integration

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/flutter-integration.yml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "sdks/flutter/packages/tugboat/**"
      - "platforms/apple/**"
      - "core/image-processing/**"
      - "TugboatCaptureRuntime.podspec"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"
  EXAMPLE_DIR: sdks/flutter/packages/tugboat/example

jobs:
  android:
    name: Android emulator smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install workspace dependencies
        run: flutter pub get
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm
          test -w /dev/kvm
      - name: Run capture smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          working-directory: ${{ env.EXAMPLE_DIR }}
          script: flutter test --no-pub --reporter expanded -d emulator-5554 integration_test/capture_smoke_test.dart

  ios:
    name: iOS simulator smoke test
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install workspace dependencies
        run: flutter pub get
      - name: Boot iPhone simulator
        id: simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available
          udid=$(xcrun simctl list devices available --json | jq -er '
            [.devices | to_entries | map(select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS-")))
             | sort_by(.key | split("-")[1:] | map(tonumber)) | reverse
             | .[] | .value[] | select(.name == "iPhone 17")][0].udid
          ')
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Run capture smoke test
        working-directory: ${{ env.EXAMPLE_DIR }}
        timeout-minutes: 18
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -o pipefail
          logs="$RUNNER_TEMP/ios-logs"
          mkdir -p "$logs"
          # flutter_tools finds the Dart VM service URL by streaming the
          # simulator log. On a cold runner that stream can attach after the
          # app has already printed the URL, and the test waits forever.
          # Keep a stream open from here on so logd is warm at launch.
          xcrun simctl spawn "$SIMULATOR_UDID" log stream --style compact \
            --predicate 'processImagePath ENDSWITH "Runner"' > "$logs/warm-stream.log" 2>&1 &
          sleep 5
          # One retry, bounded, in case the URL is still missed. The second
          # attempt reuses the build.
          for attempt in 1 2; do
            limit=$(( attempt == 1 ? 600 : 300 ))
            if perl -e 'alarm shift; exec @ARGV' "$limit" \
              flutter test --no-pub --verbose --reporter expanded -d "$SIMULATOR_UDID" \
              integration_test/capture_smoke_test.dart 2>&1 | tee "$logs/flutter-test-$attempt.log"; then
              exit 0
            fi
            echo "::warning::iOS smoke attempt $attempt did not pass"
          done
          exit 1
      - name: Collect simulator logs
        if: failure() || cancelled()
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcrun simctl spawn "$SIMULATOR_UDID" log show --last 30m --style compact \
            --predicate 'process == "Runner" OR subsystem CONTAINS "flutter"' \
            > "$RUNNER_TEMP/ios-logs/simulator.log" 2>&1 || true
          tail -n 200 "$RUNNER_TEMP/ios-logs/simulator.log"
      - name: Upload iOS logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-logs
          path: ${{ runner.temp }}/ios-logs
