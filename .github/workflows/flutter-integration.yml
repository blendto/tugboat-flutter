name: Flutter integration

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/flutter-integration.yml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "sdks/flutter/packages/tugboat/**"
      - "platforms/apple/**"
      - "core/image-processing/**"
      - "TugboatCaptureRuntime.podspec"
      - "tool/ci/device-report/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"
  EXAMPLE_DIR: sdks/flutter/packages/tugboat/example

jobs:
  android:
    name: Android emulator smoke test and device report
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install workspace dependencies
        run: flutter pub get
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm
          test -w /dev/kvm
      - name: Run smoke test, feature checklist and capture benchmarks
        uses: reactivecircus/android-emulator-runner@v2
        env:
          EMULATOR_GPU: swiftshader
        with:
          api-level: 35
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          working-directory: ${{ env.EXAMPLE_DIR }}
          # One line: the runner starts a new shell for each script line.
          script: bash "$GITHUB_WORKSPACE/tool/ci/device-report/run-device-suite.sh" android emulator-5554 "$RUNNER_TEMP/device-report"
      - name: Upload Android device report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: device-report-android
          path: ${{ runner.temp }}/device-report
          if-no-files-found: warn

  ios:
    name: iOS simulator smoke test and device report
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install workspace dependencies
        run: flutter pub get
      - name: Boot iPhone simulator
        id: simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available
          udid=$(xcrun simctl list devices available --json | jq -er '
            [.devices | to_entries | map(select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS-")))
             | sort_by(.key | split("-")[1:] | map(tonumber)) | reverse
             | .[] | .value[] | select(.name == "iPhone 17")][0].udid
          ')
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Run smoke test, feature checklist and capture benchmarks
        timeout-minutes: 75
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        # The script keeps a warm simulator log stream open and bounds and
        # retries every flutter invocation (see the comments in it).
        run: bash tool/ci/device-report/run-device-suite.sh ios "$SIMULATOR_UDID" "$RUNNER_TEMP/device-report"
      - name: Upload iOS device report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: device-report-ios
          path: ${{ runner.temp }}/device-report
          if-no-files-found: warn
      - name: Collect simulator logs
        if: failure() || cancelled()
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          mkdir -p "$RUNNER_TEMP/ios-logs"
          xcrun simctl spawn "$SIMULATOR_UDID" log show --last 30m --style compact \
            --predicate 'process == "Runner" OR subsystem CONTAINS "flutter"' \
            > "$RUNNER_TEMP/ios-logs/simulator.log" 2>&1 || true
          tail -n 200 "$RUNNER_TEMP/ios-logs/simulator.log"
      - name: Upload iOS logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-logs
          path: ${{ runner.temp }}/ios-logs

  report:
    name: Device report comment
    needs: [android, ios]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tool/ci/device-report
            sdks/flutter/packages/tugboat/lib/src/sdk_version.dart
      - uses: actions/download-artifact@v4
        with:
          pattern: device-report-*
          path: ${{ runner.temp }}/reports
      - name: Render report
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 tool/ci/device-report/render-report.py \
            --android "$RUNNER_TEMP/reports/device-report-android" \
            --ios "$RUNNER_TEMP/reports/device-report-ios" \
            --sdk-version-file sdks/flutter/packages/tugboat/lib/src/sdk_version.dart \
            --sha "$HEAD_SHA" --run-url "$RUN_URL" > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Post or update the PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- tugboat-device-report -->'
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -1)
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$RUNNER_TEMP/report.md" --jq .html_url
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F "body=@$RUNNER_TEMP/report.md" --jq .html_url
          fi
