# Lint TugboatCaptureRuntime.podspec (needs Xcode).
name: Apple runtime

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'TugboatCaptureRuntime.podspec'
      - 'Package.swift'
      - 'platforms/apple/**'
      - 'core/image-processing/**'
      - 'tool/ci/lint-apple-runtime.sh'
      - '.github/workflows/apple-runtime.yml'

permissions:
  contents: read

# One run per PR: a new push cancels the previous run. Every push to main
# gets its own group (by commit), so main runs are never cancelled or
# superseded, and each merge saves its caches.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pod-lib-lint:
    name: pod lib lint
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lint TugboatCaptureRuntime
        run: bash tool/ci/lint-apple-runtime.sh
