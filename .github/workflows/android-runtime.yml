name: Android runtime

# Runs daily from nightly.yml (everything), on demand (everything), and on
# pull requests labelled `device-report` (every push while the label is on),
# where it covers only what the Flutter SDK uses: capture-runtime, its test
# module and `:sample`, the public API dump and the Flutter plugin check. The
# unpublished native modules (tugboat-android, tugboat-sample, tugboat-compose,
# tugboat-okhttp) are skipped there. See README.md in this folder.
on:
  workflow_call:
  workflow_dispatch:
  # Pull requests labelled `device-report`: every push while the label is on.
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

# A new push to a labelled PR cancels its running tests. Adding some other
# label gets a group of its own, so it never cancels a run in progress.
concurrency:
  group: >-
    android-runtime-${{
      (github.event.action == 'labeled' && github.event.label.name != 'device-report')
      && github.run_id
      || github.event.pull_request.number || github.sha
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  aar:
    name: Build and publish local AAR
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'device-report') && (github.event.action != 'labeled' || github.event.label.name == 'device-report'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Gradle dependencies and wrapper from the cache; saved by runs on main.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also installs the obsolete "tools" package, which
          # current cmdline-tools no longer provide (sdkmanager exits 1).
          packages: platform-tools
      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-36" "build-tools;35.0.0"
      - name: Build runtime, tests, local Maven, sample
        env:
          # Pull requests: the capture runtime only. Nightly and manual runs: all modules.
          RUNTIME_ONLY: ${{ github.event_name == 'pull_request' && '--runtime-only' || '' }}
        run: |
          # shellcheck disable=SC2086 # (empty or one flag)
          bash tool/ci/build-android-runtime.sh $RUNTIME_ONLY
      - name: Verify public API dump
        run: bash tool/ci/verify-android-runtime-api.sh
      # The Flutter plugin must compile against this runtime as well as the
      # published one it pins, so a runtime change cannot break the plugin
      # unnoticed. Uses the .local-maven AAR built above.
      # The Flutter version the example's Gradle setup supports (as in the
      # device suite); newer stable releases require Gradle 9.3+.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true
      - name: Flutter plugin against the pinned and the in-repo runtime
        run: bash tool/ci/verify-flutter-plugin-runtime.sh
