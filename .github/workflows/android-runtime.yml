name: Android runtime

# Runs on pushes to main too: Gradle caches are saved only there, and
# every pull request restores them.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "platforms/android/**"
      - "core/image-processing/**"
      - "tool/ci/build-android-runtime.sh"
      - "tool/ci/dump-android-runtime-api.py"
      - "tool/ci/verify-android-runtime-api.sh"
      - "tool/ci/android-runtime-version.sh"
      - "tool/ci/verify-flutter-plugin-runtime.sh"
      - "tool/ci/capture-runtime-override.init.gradle"
      - "sdks/flutter/packages/tugboat/android/**"
      - ".github/workflows/android-runtime.yml"
      - ".github/workflows/publish-android.yml"
  push:
    branches: [main]
    paths:
      - "platforms/android/**"
      - "core/image-processing/**"
      - "tool/ci/build-android-runtime.sh"
      - "tool/ci/dump-android-runtime-api.py"
      - "tool/ci/verify-android-runtime-api.sh"
      - "tool/ci/android-runtime-version.sh"
      - "tool/ci/verify-flutter-plugin-runtime.sh"
      - "tool/ci/capture-runtime-override.init.gradle"
      - "sdks/flutter/packages/tugboat/android/**"
      - ".github/workflows/android-runtime.yml"
      - ".github/workflows/publish-android.yml"

permissions:
  contents: read

# One run per PR: a new push cancels the previous run. Runs on main are never
# cancelled, so each merge finishes and saves its caches.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  aar:
    name: Build and publish local AAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Gradle dependencies and wrapper from the cache; saved by runs on main.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also installs the obsolete "tools" package, which
          # current cmdline-tools no longer provide (sdkmanager exits 1).
          packages: platform-tools
      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-36" "build-tools;35.0.0"
      - name: Build runtime, tests, local Maven, sample
        run: bash tool/ci/build-android-runtime.sh
      - name: Verify public API dump
        run: bash tool/ci/verify-android-runtime-api.sh
      # The Flutter plugin must compile against this runtime as well as the
      # published one it pins, so a runtime change cannot break the plugin
      # unnoticed. Uses the .local-maven AAR built above.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter plugin against the pinned and the in-repo runtime
        run: bash tool/ci/verify-flutter-plugin-runtime.sh
