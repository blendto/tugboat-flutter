# Merging to main never publishes. To release, either run this workflow on
# main (cut_release tags tugboat_http-v<version> and dispatches on the tag),
# or push tag tugboat_http-v<version> yourself.
name: Publish tugboat_http

on:
  push:
    tags:
      - 'tugboat_http-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

concurrency:
  group: publish-http-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cut_release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag and dispatch unpublished version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(awk '/^version:/ {print $2}' sdks/flutter/packages/tugboat_http/pubspec.yaml)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          api=https://pub.dev/api/packages/tugboat_http
          status=$(curl -sS --retry 3 -o package.json -w '%{http_code}' "$api")
          case "$status" in
            404)
              echo "::notice::Publish the first tugboat_http version manually, then enable GitHub Actions publishing on pub.dev."
              exit 0 ;;
            200) ;;
            *) echo "::error::pub.dev returned HTTP $status"; exit 1 ;;
          esac
          jq -e '.versions | type == "array"' package.json >/dev/null
          if jq -e --arg v "$version" 'any(.versions[]; .version == $v)' package.json >/dev/null; then
            echo "Version $version is already published."
            exit 0
          fi

          tag="tugboat_http-v$version"
          git fetch --tags origin
          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          # GITHUB_TOKEN tag pushes do not start a workflow. Dispatch on the
          # tag so the OIDC identity identifies the immutable release source.
          for attempt in 1 2 3 4 5; do
            if gh workflow run publish-http.yml --ref "$tag"; then exit 0; fi
            sleep 3
          done
          exit 1

  publish:
    if: startsWith(github.ref, 'refs/tags/tugboat_http-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Publish tagged version
        working-directory: sdks/flutter/packages/tugboat_http
        run: |
          set -euo pipefail
          version=$(awk '/^version:/ {print $2}' pubspec.yaml)
          [[ "$GITHUB_REF_NAME" == "tugboat_http-v$version" ]]
          status=$(curl -sS --retry 3 -o /dev/null -w '%{http_code}' "https://pub.dev/api/packages/tugboat_http/versions/$version")
          case "$status" in
            200) echo "Version $version is already published."; exit 0 ;;
            404) ;;
            *) echo "::error::pub.dev returned HTTP $status"; exit 1 ;;
          esac
          dart pub get
          dart pub publish --force
