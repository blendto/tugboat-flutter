name: Device suite

# The Flutter example on an Android emulator and an iOS simulator: feature
# checklist and capture benchmarks, built against the
# SDK and native runtimes in this repo. Not a merge gate: it runs only when
# asked for.
#   - Actions tab: "Run workflow" (once this file is on the default branch).
#   - A pull request labelled `device-report`: every push while the label is
#     on. The report is posted as a PR comment.
#   - Another workflow: `uses: ./.github/workflows/device-suite.yml`. The
#     calling job must grant `contents: read` and `pull-requests: write`
#     (a called workflow cannot have more than its caller).
# Only a run of both platforms updates the PR comment. `ref` must contain
# this workflow's scripts (tool/ci/device-report and
# tool/ci/publish-android-runtime-local.sh), so it cannot be older than them.

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to test (default the caller's commit); must contain this workflow's scripts.
        type: string
        default: ""
      platforms:
        description: "android, ios, or android,ios"
        type: string
        default: "android,ios"
      pr-number:
        description: Pull request to post the report on (optional).
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to test (default the selected branch); must contain this workflow's scripts.
        type: string
        default: ""
      platforms:
        description: "android, ios, or android,ios"
        type: string
        default: "android,ios"
      pr-number:
        description: Pull request to post the report on (optional).
        type: string
        default: ""
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

# A new push to a labelled PR cancels its running suite. Manual and called
# runs (they always have inputs.platforms) and runs for some other label
# each get a group of their own, so they never cancel a run in progress.
concurrency:
  group: >-
    device-suite-${{
      (inputs.platforms != '' || (github.event.action == 'labeled' && github.event.label.name != 'device-report'))
      && github.run_id
      || github.event.pull_request.number
    }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"
  EXAMPLE_DIR: sdks/flutter/packages/tugboat/example

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
      ref: ${{ steps.plan.outputs.ref }}
      pr: ${{ steps.plan.outputs.pr }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'device-report') }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IN_REF: ${{ inputs.ref }}
          IN_PLATFORMS: ${{ inputs.platforms }}
          IN_PR: ${{ inputs.pr-number }}
        run: |
          run=true
          # A called workflow sees its caller's event, so a run with inputs
          # (manual or called; platforms always has a value then) follows
          # its inputs whatever the event is.
          if [[ -z "$IN_PLATFORMS" && "$EVENT" == pull_request ]]; then
            # Only PRs carrying the label; a different label being added is
            # not a reason to run again.
            if [[ "$HAS_LABEL" != true ]] || { [[ "$ACTION" == labeled ]] && [[ "$LABEL" != device-report ]]; }; then
              run=false
            fi
            ref="$PR_SHA"; pr="$PR_NUMBER"; platforms="android,ios"
          else
            ref="${IN_REF:-$GITHUB_SHA}"; pr="$IN_PR"; platforms="${IN_PLATFORMS:-android,ios}"
          fi
          platforms="$(tr -d ' ' <<< "${platforms,,}")"
          IFS=, read -ra wanted <<< "$platforms"
          for p in "${wanted[@]}"; do
            if [[ "$p" != android && "$p" != ios ]]; then
              echo "::error::Unknown platform '$p' in '$platforms'; use android, ios or android,ios."
              exit 1
            fi
          done
          for p in android ios; do
            on=false
            [[ "$run" == true && ",$platforms," == *",$p,"* ]] && on=true
            echo "$p=$on" >> "$GITHUB_OUTPUT"
          done
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "run=$run platforms=$platforms ref=$ref pr=${pr:-none}"

  android:
    name: Android emulator
    needs: plan
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Gradle dependencies and wrapper from the cache (saved by runs on the
      # default branch); a cold run downloads them from Maven Central.
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install workspace dependencies
        run: flutter pub get
      # The example resolves capture-runtime from .local-maven, never from
      # Maven Central, so the report measures the runtime in this commit.
      # The built AAR is cached by a hash of everything it is built from, so
      # it is rebuilt exactly when that source changes.
      # Saved right after the build, so a failing test later in the job
      # does not throw the build away.
      - name: Restore the in-repo capture-runtime
        id: runtime
        uses: actions/cache/restore@v4
        with:
          path: .local-maven/com/gettugboat/sdk/capture-runtime
          key: capture-runtime-${{ hashFiles('platforms/android/capture-runtime/**', 'core/image-processing/**', 'platforms/android/*.kts', 'platforms/android/gradle.properties', 'platforms/android/gradle/**', 'tool/ci/publish-android-runtime-local.sh') }}
      - name: Build the in-repo capture-runtime
        if: steps.runtime.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null
          bash tool/ci/publish-android-runtime-local.sh
      - name: Save the in-repo capture-runtime
        if: steps.runtime.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .local-maven/com/gettugboat/sdk/capture-runtime
          key: ${{ steps.runtime.outputs.cache-primary-key }}
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -w /dev/kvm
      - name: Feature checklist and capture benchmarks
        uses: reactivecircus/android-emulator-runner@v2
        env:
          EMULATOR_GPU: swiftshader
        with:
          api-level: 35
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          working-directory: ${{ env.EXAMPLE_DIR }}
          # One line: the runner starts a new shell for each script line.
          script: bash "$GITHUB_WORKSPACE/tool/ci/device-report/run-device-suite.sh" android emulator-5554 "$RUNNER_TEMP/device-report"
      - name: Upload Android device report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: device-report-android
          path: ${{ runner.temp }}/device-report
          if-no-files-found: warn

  ios:
    name: iOS simulator
    needs: plan
    if: needs.plan.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install workspace dependencies
        run: flutter pub get
      - name: Boot iPhone simulator
        id: simulator
        run: |
          xcodebuild -version
          udid=$(xcrun simctl list devices available --json | jq -er '
            [.devices | to_entries | map(select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS-")))
             | sort_by(.key | split("-")[1:] | map(tonumber)) | reverse
             | .[] | .value[] | select(.name == "iPhone 17")][0].udid
          ')
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Feature checklist and capture benchmarks
        timeout-minutes: 65
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        # The script builds and launches the app once before the first test,
        # keeps a simulator log stream open, and bounds and retries every
        # flutter invocation (see the comments in it).
        run: bash tool/ci/device-report/run-device-suite.sh ios "$SIMULATOR_UDID" "$RUNNER_TEMP/device-report"
      - name: Upload iOS device report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: device-report-ios
          path: ${{ runner.temp }}/device-report
          if-no-files-found: warn
      - name: Collect simulator logs
        if: failure() || cancelled()
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          mkdir -p "$RUNNER_TEMP/ios-logs"
          xcrun simctl spawn "$SIMULATOR_UDID" log show --last 30m --style compact \
            --predicate 'process == "Runner" OR subsystem CONTAINS "flutter"' \
            > "$RUNNER_TEMP/ios-logs/simulator.log" 2>&1 || true
          tail -n 200 "$RUNNER_TEMP/ios-logs/simulator.log"
      - name: Upload iOS logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-logs
          path: ${{ runner.temp }}/ios-logs

  report:
    name: Device report
    needs: [plan, android, ios]
    if: ${{ !cancelled() && (needs.plan.outputs.android == 'true' || needs.plan.outputs.ios == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          sparse-checkout: |
            tool/ci/device-report
            sdks/flutter/packages/tugboat/lib/src/sdk_version.dart
      - uses: actions/download-artifact@v4
        with:
          pattern: device-report-*
          path: ${{ runner.temp }}/reports
      - name: Render report
        id: render
        env:
          ANDROID: ${{ needs.plan.outputs.android }}
          IOS: ${{ needs.plan.outputs.ios }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          sha=$(git rev-parse HEAD)
          args=(--sdk-version-file sdks/flutter/packages/tugboat/lib/src/sdk_version.dart
                --sha "$sha" --run-url "$RUN_URL" --expected-rows 13)
          [[ "$ANDROID" == true ]] && args+=(--android "$RUNNER_TEMP/reports/device-report-android")
          [[ "$IOS" == true ]] && args+=(--ios "$RUNNER_TEMP/reports/device-report-ios")
          python3 tool/ci/device-report/render-report.py "${args[@]}" \
            --complete-file "$RUNNER_TEMP/complete" > "$RUNNER_TEMP/report.md"
          echo "complete=$(cat "$RUNNER_TEMP/complete")" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Post or update the PR comment
        if: needs.plan.outputs.pr != '' && needs.plan.outputs.android == 'true' && needs.plan.outputs.ios == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.plan.outputs.pr }}
          COMPLETE: ${{ steps.render.outputs.complete }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # An incomplete run does not replace a complete report: it only
        # flags the existing comment as out of date.
        run: |
          python3 tool/ci/device-report/upsert-comment.py \
            --repo "$GITHUB_REPOSITORY" --pr "$PR" --report "$RUNNER_TEMP/report.md" \
            --complete "$COMPLETE" --run-url "$RUN_URL"
