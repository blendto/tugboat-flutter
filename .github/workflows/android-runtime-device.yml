name: Android runtime device tests

# Runs :capture-runtime-test:connectedAndroidTest (lifecycle and window
# capture) on emulators: API 26 is the window-capture floor and uses the
# two-animation-frame wait; API 34 uses the frame-commit callback.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "platforms/android/capture-runtime/**"
      - "platforms/android/capture-runtime-test/**"
      - "core/image-processing/**"
      - ".github/workflows/android-runtime-device.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-runtime-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connected:
    name: Instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            target: default
          - api-level: 34
            target: google_apis
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-36" "build-tools;35.0.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        working-directory: platforms/android
        run: ./gradlew :capture-runtime-test:assembleDebugAndroidTest
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: platforms/android
          script: ./gradlew :capture-runtime-test:connectedDebugAndroidTest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-reports-api-${{ matrix.api-level }}
          path: |
            platforms/android/capture-runtime-test/build/reports/androidTests
            platforms/android/capture-runtime-test/build/outputs/androidTest-results
          if-no-files-found: ignore
