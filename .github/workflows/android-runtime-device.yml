name: Android runtime device tests

# Runs :capture-runtime-test:connectedAndroidTest (lifecycle and window
# capture) on emulators: API 26 is the window-capture floor and uses the
# two-animation-frame wait; API 34 uses the frame-commit callback.
# Nightly and on demand it also runs :tugboat-android:connectedAndroidTest: the
# real session engine through JNI, including the collector contract test
# (session_start body, frameMetadata backends). Pull requests labelled
# `device-report` (every push while the label is on) run only
# :capture-runtime-test, the part the Flutter SDK uses. See
# .github/workflows/README.md.
on:
  workflow_call:
  workflow_dispatch:
  # Pull requests labelled `device-report`: every push while the label is on.
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

# A new push to a labelled PR cancels its running tests. Adding some other
# label gets a group of its own, so it never cancels a run in progress.
concurrency:
  group: >-
    android-runtime-device-${{
      (github.event.action == 'labeled' && github.event.label.name != 'device-report')
      && github.run_id
      || github.event.pull_request.number || github.sha
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  connected:
    name: Instrumented tests (API ${{ matrix.api-level }})
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'device-report') && (github.event.action != 'labeled' || github.event.label.name == 'device-report'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            target: default
          - api-level: 34
            target: google_apis
    env:
      # Pull requests: the capture runtime only. Nightly and manual runs add :tugboat-android.
      BUILD_TASKS: ${{ github.event_name == 'pull_request' && ':capture-runtime-test:assembleDebugAndroidTest' || ':capture-runtime-test:assembleDebugAndroidTest :tugboat-android:assembleDebugAndroidTest' }}
      CONNECTED_TASKS: ${{ github.event_name == 'pull_request' && ':capture-runtime-test:connectedDebugAndroidTest' || ':capture-runtime-test:connectedDebugAndroidTest :tugboat-android:connectedDebugAndroidTest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Gradle dependencies and wrapper from the cache; saved by runs on main.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-36" "build-tools;35.0.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        working-directory: platforms/android
        run: |
          # shellcheck disable=SC2086 # (a list of tasks)
          ./gradlew $BUILD_TASKS
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: platforms/android
          script: ./gradlew $CONNECTED_TASKS
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-reports-api-${{ matrix.api-level }}
          path: |
            platforms/android/capture-runtime-test/build/reports/androidTests
            platforms/android/capture-runtime-test/build/outputs/androidTest-results
            platforms/android/tugboat-android/build/reports/androidTests
            platforms/android/tugboat-android/build/outputs/androidTest-results
          if-no-files-found: ignore
