# Build the Swift host (`Tugboat`), run the package XCTests on an iOS
# simulator, build the SwiftUI sample app, run the sample's XCUITests, and
# build and test the optional `TugboatAlamofire` package (needs Xcode).
name: Apple host

# Runs on pull requests labelled `device-report` (every push while the
# label is on) or on demand (see README.md in this folder).
on:
  # Pull requests labelled `device-report`: every push while the label is on.
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a labelled PR cancels its running tests. Adding some other
# label gets a group of its own, so it never cancels a run in progress.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      (github.event.action == 'labeled' && github.event.label.name != 'device-report')
      && github.run_id
      || github.event.pull_request.number || github.sha
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: swift build + xcodebuild test
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'device-report') && (github.event.action != 'labeled' || github.event.label.name == 'device-report'))
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and test
        run: bash tool/ci/test-apple-host.sh
      - name: Build the SwiftUI sample (XcodeGen)
        # Reported even when a test failed: the sample build is independent.
        if: success() || failure()
        run: bash tool/ci/build-apple-sample.sh

  sample-ui:
    name: SwiftUI sample XCUITests
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'device-report') && (github.event.action != 'labeled' || github.event.label.name == 'device-report'))
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run the sample's UI tests (XcodeGen)
        run: bash tool/ci/test-apple-sample-ui.sh

  alamofire:
    name: TugboatAlamofire build + test
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'device-report') && (github.event.action != 'labeled' || github.event.label.name == 'device-report'))
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and test the TugboatAlamofire package
        run: bash tool/ci/test-apple-alamofire.sh
