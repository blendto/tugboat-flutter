# Publishes @tugboat-ai/react-native (sdks/react-native) to npm.
#
# Merging to main never publishes. To release, either:
# 1. Run this workflow on main (Actions > Run workflow). cut_release creates
#    tag react-native-v<version> at that commit and dispatches this workflow
#    on the tag, or
# 2. Push tag react-native-v<version> yourself.
# On that tag (push or workflow_dispatch), the package is published.
#
# Authentication: npm trusted publishing (GitHub Actions OIDC, no token).
# On https://www.npmjs.com/package/@tugboat-ai/react-native/access add a
# trusted publisher: GitHub Actions, organization blendto, repository
# tugboat-mobile-sdk, workflow filename publish-react-native.yml.
# If npm will not let you add it before the package exists, make the first
# release with an NPM_TOKEN repository secret (a granular token that can
# publish to the tugboat-ai scope). A new trusted publisher expires unless it
# publishes within 2 days, so add it just before the next release, and delete
# NPM_TOKEN only after a release has gone out through OIDC.
#
# The publish refuses to run until the native SDKs the package pins are on
# Maven Central and CocoaPods trunk (tool/ci/check-react-native-native-deps.sh).
name: Publish React Native

on:
  push:
    tags:
      - 'react-native-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

concurrency:
  group: publish-react-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cut_release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          name="$(node -p "require('./sdks/react-native/package.json').name")"
          version="$(node -p "require('./sdks/react-native/package.json').version")"
          tag="react-native-v${version}"
          sdk_version="$(sed -nE "s/^export const SDK_VERSION = '([^']+)';.*/\1/p" sdks/react-native/src/sdkVersion.ts | head -1)"
          if [[ "${sdk_version}" != "${version}" ]]; then
            echo "::error::sdks/react-native/src/sdkVersion.ts (${sdk_version}) must equal package.json version (${version})."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "${name} version: ${version}"
          code="$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${name/\//%2f}/${version}")"
          if [[ "$code" == "200" ]]; then
            echo "${name} ${version} is already on npm. Skipping tag."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_publish=true" >> "$GITHUB_OUTPUT"

      - name: Check native SDKs are published
        if: steps.version.outputs.should_publish == 'true'
        run: bash tool/ci/check-react-native-native-deps.sh

      - name: Create tag and dispatch publish
        if: steps.version.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          git fetch --tags origin
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "@tugboat-ai/react-native ${VERSION}"
            git push origin "${TAG}"
          fi

          # GITHUB_TOKEN tag pushes do not trigger other workflows. Dispatch on
          # the tag so the publish runs from the tag ref.
          for attempt in 1 2 3 4 5; do
            if gh workflow run publish-react-native.yml --ref "${TAG}"; then
              echo "Dispatched publish-react-native.yml on ${TAG}."
              exit 0
            fi
            echo "Dispatch failed (attempt ${attempt}); waiting for tag to appear."
            sleep 3
          done
          echo "::error::Could not dispatch publish-react-native.yml on ${TAG}."
          exit 1

  publish:
    if: startsWith(github.ref, 'refs/tags/react-native-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: sdks/react-native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Trusted publishing needs Node 22.14+ and npm 11.5.1+.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm 11.5.1 or later
        run: |
          set -euo pipefail
          if ! node -e "const [a,b,c]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)"; then
            npm install -g npm@11
          fi
          npm --version

      - name: Verify version
        id: version
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          expected_tag="react-native-v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "::error::Git tag ${GITHUB_REF_NAME} must be ${expected_tag} to publish ${name} ${version}."
            exit 1
          fi
          sdk_version="$(sed -nE "s/^export const SDK_VERSION = '([^']+)';.*/\1/p" src/sdkVersion.ts | head -1)"
          if [[ "${sdk_version}" != "${version}" ]]; then
            echo "::error::src/sdkVersion.ts (${sdk_version}) must equal package.json version (${version})."
            exit 1
          fi
          code="$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${name/\//%2f}/${version}")"
          if [[ "$code" == "200" ]]; then
            echo "${name} ${version} is already on npm."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check native SDKs are published
        if: steps.version.outputs.should_publish == 'true'
        run: bash ../../tool/ci/check-react-native-native-deps.sh

      - name: Show package contents
        if: steps.version.outputs.should_publish == 'true'
        run: npm pack --dry-run

      - name: Publish to npm
        if: steps.version.outputs.should_publish == 'true'
        env:
          # Empty once the trusted publisher is configured; npm then uses OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
