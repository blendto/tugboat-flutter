name: Version bump check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  check-tugboat-version:
    name: Require tugboat version bump
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare package version to base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PACKAGE_PUBSPEC: packages/tugboat/pubspec.yaml
        run: |
          set -euo pipefail

          extract_version() {
            local file="$1"
            if [[ ! -f "$file" ]]; then
              echo ""
              return
            fi
            grep -E '^version:' "$file" | head -1 | sed -E 's/^version:[[:space:]]*//' | tr -d '"' | tr -d "'" | tr -d '[:space:]'
          }

          if [[ ! -f "$PACKAGE_PUBSPEC" ]]; then
            echo "::error::$PACKAGE_PUBSPEC is missing on this branch"
            exit 1
          fi

          head_version="$(extract_version "$PACKAGE_PUBSPEC")"
          if [[ -z "$head_version" ]]; then
            echo "::error::Could not read version from $PACKAGE_PUBSPEC"
            exit 1
          fi

          base_file="$(mktemp)"
          if ! git show "${BASE_SHA}:${PACKAGE_PUBSPEC}" >"$base_file" 2>/dev/null; then
            echo "Base branch has no $PACKAGE_PUBSPEC; treating as new package (ok)."
            echo "PR version: $head_version"
            exit 0
          fi

          base_version="$(extract_version "$base_file")"
          rm -f "$base_file"

          if [[ -z "$base_version" ]]; then
            echo "::error::Could not read version from base $PACKAGE_PUBSPEC"
            exit 1
          fi

          echo "Base version: $base_version"
          echo "PR version:   $head_version"

          if [[ "$head_version" == "$base_version" ]]; then
            echo "::error::packages/tugboat version must be bumped before merge (still $base_version)."
            exit 1
          fi

          higher="$(printf '%s\n%s\n' "$base_version" "$head_version" | sort -V | tail -n 1)"
          if [[ "$higher" != "$head_version" ]]; then
            echo "::error::PR version ($head_version) must be greater than base ($base_version)."
            exit 1
          fi

          echo "Version bump detected: $base_version -> $head_version"

  check-tugboat-dio-lockstep:
    name: Require tugboat_dio lockstep bump
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare package versions to base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          extract_version() {
            local file="$1"
            if [[ ! -f "$file" ]]; then
              echo ""
              return
            fi
            grep -E '^version:' "$file" | head -1 | sed -E 's/^version:[[:space:]]*//' | tr -d '"' | tr -d "'" | tr -d '[:space:]'
          }

          tugboat_head="$(extract_version packages/tugboat/pubspec.yaml)"
          dio_head="$(extract_version packages/tugboat_dio/pubspec.yaml)"
          if [[ -z "$tugboat_head" || -z "$dio_head" ]]; then
            echo "::error::Could not read head package versions."
            exit 1
          fi
          if [[ "$tugboat_head" != "$dio_head" ]]; then
            echo "::error::tugboat ($tugboat_head) and tugboat_dio ($dio_head) must stay lockstep."
            exit 1
          fi

          dio_base_file="$(mktemp)"
          if ! git show "${BASE_SHA}:packages/tugboat_dio/pubspec.yaml" >"$dio_base_file" 2>/dev/null; then
            echo "Base branch has no tugboat_dio pubspec; treating as new package (ok)."
            echo "PR tugboat_dio version: $dio_head"
            exit 0
          fi
          dio_base="$(extract_version "$dio_base_file")"
          rm -f "$dio_base_file"
          if [[ -z "$dio_base" ]]; then
            echo "::error::Could not read base tugboat_dio version."
            exit 1
          fi
          if [[ "$dio_head" == "$dio_base" ]]; then
            echo "::error::packages/tugboat_dio version must be bumped before merge (still $dio_base)."
            exit 1
          fi
          echo "tugboat_dio bump detected: $dio_base -> $dio_head"
