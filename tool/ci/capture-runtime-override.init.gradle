// Gradle init script for verify-flutter-plugin-runtime.sh, passed with
// `./gradlew -I`. A no-op unless TUGBOAT_CAPTURE_RUNTIME_VERSION and
// TUGBOAT_LOCAL_MAVEN are set. When set, com.gettugboat.sdk:capture-runtime
// resolves only from TUGBOAT_LOCAL_MAVEN (the repository's .local-maven) at
// that version, so the Flutter plugin is compiled against the local AAR
// without editing its pinned dependency.
def overrideVersion = System.getenv("TUGBOAT_CAPTURE_RUNTIME_VERSION")
def localMaven = System.getenv("TUGBOAT_LOCAL_MAVEN")
// Included builds (Flutter's Gradle plugin) keep their own repositories.
if (overrideVersion && localMaven && gradle.parent == null) {
    allprojects {
        repositories {
            exclusiveContent {
                forRepository {
                    maven { url = uri(localMaven) }
                }
                filter {
                    includeModule("com.gettugboat.sdk", "capture-runtime")
                }
            }
        }
        configurations.configureEach {
            resolutionStrategy.eachDependency { details ->
                if (details.requested.group == "com.gettugboat.sdk" &&
                        details.requested.name == "capture-runtime") {
                    details.useVersion(overrideVersion)
                    details.because("verify-flutter-plugin-runtime.sh")
                }
            }
        }
    }
}
