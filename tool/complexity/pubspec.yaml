# Runs the complexity gate (`dart run melos run complexity`) outside the
# workspace. dallow 0.2.1 requires analyzer ^7, which cannot parse current
# Flutter SDK sources from build_runner, so it gets its own resolution and
# lockfile instead of pinning analyzer for every workspace package.
name: tugboat_complexity_tool
publish_to: none

environment:
  sdk: ^3.9.2

dev_dependencies:
  dallow: 0.2.1
