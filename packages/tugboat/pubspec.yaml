name: tugboat
description: >-
  Screenshot-based session replay with compact interaction anchors for Tugboat.
version: 0.4.2
repository: https://github.com/blendto/tugboat-flutter
issue_tracker: https://github.com/blendto/tugboat-flutter/issues
homepage: https://github.com/blendto/tugboat-flutter
license: AGPL-3.0-only

environment:
  sdk: ^3.9.2
  flutter: ">=3.35.0"

resolution: workspace

dependencies:
  crypto: ^3.0.6
  device_info_plus: ^10.1.1
  flutter:
    sdk: flutter
  http: ^1.4.0
  image: ^4.5.4
  package_info_plus: ^8.0.1
  http_parser: ^4.1.2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - test/assets/red_square.png
