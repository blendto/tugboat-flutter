name: tugboat_dio
description: >-
  Dio interceptor that records safe, bounded network evidence into an active
  Tugboat capture session.
version: 0.8.12
# Repository links are omitted so hosts can depend on pub.dev after this
# GitHub repository is private. Published source remains on pub.dev.
license: AGPL-3.0-only

environment:
  sdk: ^3.9.2
  flutter: ">=3.35.0"

resolution: workspace

dependencies:
  dio: ^5.4.0
  flutter:
    sdk: flutter
  tugboat: ^0.8.12

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
