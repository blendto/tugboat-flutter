name: tugboat_flutter_workspace
publish_to: none

environment:
  sdk: ^3.9.2

workspace:
  - packages/tugboat
  - packages/tugboat/example

dev_dependencies:
  melos: ^7.8.2

melos:
  scripts:
    format:
      run: dart format .
      description: Format Dart source across the workspace.
    analyze:
      run: dart analyze .
      description: Analyze every package in the workspace.
    test:
      run: flutter test packages/tugboat
      description: Run all package tests.
    test:sdk:
      run: flutter test packages/tugboat
      description: Run the Flutter SDK tests.
