name: tugboat_flutter_workspace
publish_to: none

environment:
  sdk: ^3.9.2

workspace:
  - packages/tugboat
  - packages/tugboat/example
  - packages/tugboat_dio

dev_dependencies:
  melos: ^7.8.2

melos:
  scripts:
    format:
      run: dart format .
      description: Format Dart source across the workspace.
    analyze:
      run: dart analyze .
      description: Analyze every package in the workspace.
    test:
      run: cd packages/tugboat && flutter test -j 1 . && cd ../tugboat_dio && flutter test -j 1 .
      description: Run all package tests with each package's asset bundle.
    test:sdk:
      run: cd packages/tugboat && flutter test -j 1 .
      description: Run the Flutter SDK tests.
    test:dio:
      run: cd packages/tugboat_dio && flutter test -j 1 .
      description: Run the Dio adapter tests.
