name: tugboat_flutter_workspace
publish_to: none

environment:
  sdk: ^3.9.2

workspace:
  - sdks/flutter/packages/tugboat
  - sdks/flutter/packages/tugboat/example
  - sdks/flutter/packages/tugboat_dio

dev_dependencies:
  dallow: ^0.2.1
  melos: ^7.8.2

melos:
  scripts:
    format:
      run: dart format .
      description: Format Dart source across the workspace.
    analyze:
      run: dart analyze .
      description: Analyze every package in the workspace.
    complexity:
      run: dart run dallow complexity --recursive --max-complexity 10 --fail-on warning .
      description: Reject functions with cyclomatic complexity above 10.
    test:
      run: bash tool/ci/run-flutter-tests.sh
      description: Run all package tests with each package's asset bundle.
    test:sdk:
      run: bash tool/ci/run-flutter-tests.sh tugboat
      description: Run the Flutter SDK tests.
    test:dio:
      run: bash tool/ci/run-flutter-tests.sh tugboat_dio
      description: Run the Dio adapter tests.
